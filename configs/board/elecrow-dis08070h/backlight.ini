; Elecrow DIS08070H (CrowPanel ESP32 HMI 7.0"): the backlight of the display is wired to IO2 (a MOSFET: the LEDC output, high = lit).
; 5 kHz is above what the eye and a camera see as flicker; 10 bits are 1024 steps of brightness. It starts at full brightness.
; dmlcdtft (lcd.ini) switches the same pin as a plain output: the display driver does not know about this device (yet), this one
; only drives the pin with the PWM signal through the GPIO matrix, so it must be created after it (dmpwm after dmlcdtft in flash.dmd).

[backlight_pwm]
driver_name=dmpwm
driver_order=4
pin=2
frequency=5000
resolution=10
duty=100
inverted=off
enabled=on
