name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test-core:
    name: Build and Test dmpwm (core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmpwm core module
        run: |
          mkdir -p build
          cd build
          # dmpwm links against dmpwm_port_if (headers only),
          # not dmpwm_port itself, so building only these two targets
          # never touches src/port/*/port.c - safe to build natively here
          # regardless of which CPU family the port defaults to.
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64
          cmake --build . --target dmpwm test_dmpwm

      - name: Build x86_64 dmpwm_port stand-in
        run: |
          # dmpwm_port has no x86_64 peripheral: src/port/x86_64/port.c is a software stand-in, built so dmod_loader has
          # something to satisfy dmpwm's runtime dmpwm_port dependency with below.
          mkdir -p build_dmpwm_port_x86_64
          cd build_dmpwm_port_x86_64
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64 -DDMOD_CPU_FAMILY=x86_64
          cmake --build . --target dmpwm_port
          cp dmf/dmpwm_port.dmf dmf/dmpwm_port.dmd ../build/dmf/

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmpwm.dmf
          test -f build/dmf/dmpwm_version.txt
          test -f build/dmf/test_dmpwm.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          # dmpwm's runtime dependencies (dmini) are staged into build/dmf first; dmpwm_port (the stand-in above) has no
          # published x86_64 release, so a failed lookup of it must not stop the run.
          dmf-get install -d build/dmf/dmpwm.dmd -y || true
          dmod_loader build/dmf/test_dmpwm.dmf

  discover-cpu-families:
    name: Discover CPU Families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cpu_families: ${{ steps.list-families.outputs.cpu_families }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available CPU families
        id: list-families
        run: |
          # Find all CPU families by looking for directories containing port.c
          CPU_FAMILIES=$(find src/port -mindepth 2 -maxdepth 2 -name "port.c" -type f -printf '%h\n' | \
            xargs -n1 basename | \
            sort | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Found CPU families: $CPU_FAMILIES"
          echo "cpu_families=$CPU_FAMILIES" >> $GITHUB_OUTPUT

  build-dmpwm:
    name: Build dmpwm for ${{ matrix.cpu_family }}
    needs: discover-cpu-families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        cpu_family: ${{ fromJson(needs.discover-cpu-families.outputs.cpu_families) }}

    container:
      image: chocotechnologies/dmod:1.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmpwm for ${{ matrix.cpu_family }}
        run: |
          set -e
          CPU_FAMILY="${{ matrix.cpu_family }}"
          mkdir -p build_$CPU_FAMILY
          cd build_$CPU_FAMILY

          cmake .. -DDMOD_CPU_FAMILY="${CPU_FAMILY}"
          cmake --build .

          echo "Build completed for CPU family: ${CPU_FAMILY}"
          ls -lh dmf/

      - name: Verify dmpwm_port module files
        run: |
          CPU_FAMILY="${{ matrix.cpu_family }}"
          echo "Checking for dmpwm_port module files for ${CPU_FAMILY}..."
          ls -lh build_$CPU_FAMILY/dmf/
          test -f build_$CPU_FAMILY/dmf/dmpwm_port.dmf
          test -f build_$CPU_FAMILY/dmf/dmpwm_port_version.txt
          echo "Module files present for ${CPU_FAMILY}"
